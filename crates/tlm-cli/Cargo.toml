[package]
name = "tlm-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line tool for training and running tiny language models on the CPU"

[[bin]]
name = "tlm"
path = "src/main.rs"

[dependencies]
tlm-core = { path = "../tlm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
