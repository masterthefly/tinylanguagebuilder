name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Native tests (engine, command-line tool, wasm bindings)
        run: cargo test --workspace
      - name: The wasm module still builds
        run: cargo build -p tlm-wasm --target wasm32-unknown-unknown --release
