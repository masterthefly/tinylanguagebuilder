name: Idea or feature request
description: Suggest an improvement to the app, the textbook or the engine
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. This is a teaching project that runs on the CPU with no server, so ideas that make it
        clearer or more useful to a learner fit best.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, or what is missing?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - The app
        - The textbook
        - The engine (model, training, fine-tuning)
        - The command-line tool
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
  - type: checkboxes
    id: help
    attributes:
      label: Would you like to work on it?
      options:
        - label: I would be happy to try a pull request, with some guidance
